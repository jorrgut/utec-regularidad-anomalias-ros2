# Prueba rápida de los scripts (sin ROS 2) en las dos versiones de Python
# de los entornos del curso: 3.10 (Humble) y 3.12 (Jazzy).
name: smoke-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scripts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencias (mismas versiones que el Dockerfile)
        run: |
          pip install "numpy==1.26.4" "pandas==2.2.3" "matplotlib==3.8.4" \
                      "python-dateutil==2.9.0.post0" pyyaml
          pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Prueba de las seis unidades y del integrador
        run: bash tests/smoke_test.sh
