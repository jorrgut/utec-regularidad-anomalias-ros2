name: utec_optativa

services:
  ros2:
    build: .
    container_name: utec_ros2_humble
    stdin_open: true
    tty: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=1
      - TURTLEBOT3_MODEL=burger
    volumes:
      - ./:/home/student/project:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /home/student/project
